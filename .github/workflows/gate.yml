# The gate, tools/gates.sh, on every push and pull request: sync, lint, types, tests, the
# frontend typecheck, build and tests (skipped without frontend/), and the leftover scan.
name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: tools/gates.sh
